name: Backend tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  junit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run automated tests (Task C)
        working-directory: backend
        run: mvn -B test
